name: Desktop Build — Tauri (Windows + macOS)

# Build manuel (workflow_dispatch) ou sur tag desktop-v* → génère les installeurs.
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    name: Build ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prise-inventaire-web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: prise-inventaire-web/src-tauri

      - name: Install frontend deps
        working-directory: prise-inventaire-web
        run: npm ci

      # tauri-action lance beforeBuildCommand (npm run build:desktop) puis bundle.
      # Sur un tag desktop-v* : crée une Release GitHub et y attache les installeurs
      # (liens de téléchargement publics). Sur workflow_dispatch : build seul (artefacts).
      - name: Build & bundle (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: prise-inventaire-web
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Prise Inventaire Desktop ${{ github.ref_name }}'
          releaseBody: "Installeurs de test (non signés). Windows : SmartScreen → « Informations complémentaires » → « Exécuter quand même ». macOS : clic droit → « Ouvrir »."
          releaseDraft: false
          prerelease: true

      - name: Upload installeurs
        uses: actions/upload-artifact@v4
        with:
          name: prise-inventaire-desktop-${{ matrix.platform }}
          path: |
            prise-inventaire-web/src-tauri/target/release/bundle/**/*.dmg
            prise-inventaire-web/src-tauri/target/release/bundle/**/*.msi
            prise-inventaire-web/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
