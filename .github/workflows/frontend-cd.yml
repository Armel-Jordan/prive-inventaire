name: Frontend CD — Deploy DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'prise-inventaire-web/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:

concurrency:
  group: production-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy web (droplet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prise-inventaire-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prise-inventaire-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (mode production -> VITE_API_URL=/api, même origine)
        run: npm run build

      - name: Copier le build sur le droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "prise-inventaire-web/dist/*"
          target: "/var/www/prise-web-tmp"
          strip_components: 2

      - name: Publier + recharger nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            rm -rf /var/www/prise-web
            mv /var/www/prise-web-tmp /var/www/prise-web
            chown -R www-data:www-data /var/www/prise-web
            nginx -t && systemctl reload nginx
            echo "✅ Front déployé"
