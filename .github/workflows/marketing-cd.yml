name: Marketing CD — Deploy DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'prise-inventaire-marketing/**'
      - '.github/workflows/marketing-cd.yml'
  workflow_dispatch:

concurrency:
  group: production-marketing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy marketing (droplet, port 8080)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prise-inventaire-marketing

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prise-inventaire-marketing/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copier le build sur le droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "prise-inventaire-marketing/dist/*"
          target: "/var/www/prise-marketing-tmp"
          strip_components: 2

      - name: Publier + recharger nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            rm -rf /var/www/prise-marketing
            mv /var/www/prise-marketing-tmp /var/www/prise-marketing
            chown -R www-data:www-data /var/www/prise-marketing
            nginx -t && systemctl reload nginx
            echo "✅ Marketing déployé (port 8080)"
