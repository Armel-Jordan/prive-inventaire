# Nginx — Espace client (site des clients des entreprises) — port 8081
#
# À côté du back-office (port 80) et du site marketing (port 8080), sur le même droplet.
# Installé et mis à jour par le workflow .github/workflows/client-cd.yml :
#   /etc/nginx/sites-available/prise-espace-client (+ lien dans sites-enabled).
# /api est transmis à Laravel : même origine pour le navigateur, pas de CORS.
#
# Avec un domaine : remplacer « listen 8081 » par 80 (puis 443 avec Let's Encrypt) et
# « server_name _ » par clients.<domaine> ; régler ESPACE_CLIENT_URL dans le .env de l'API.

server {
    listen 8081;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    charset utf-8;
    client_max_body_size 20M;

    # Racine = build de l'espace client (déployé par le workflow client-cd)
    root /var/www/prise-client;
    index index.html;

    # --- API Laravel : /api/* passe par le front controller ---
    location /api {
        root /var/www/prise-api/prise-inventaire-api/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/prise-api/prise-inventaire-api/public;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- Espace client (SPA React) : fichiers statiques + routes du navigateur ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
