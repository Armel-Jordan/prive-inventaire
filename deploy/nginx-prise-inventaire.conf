# Nginx — Prise Inventaire (DigitalOcean) — config éprouvée en prod
#
# Server 1 (port 80)   : APP web (SPA React) + API Laravel, MÊME origine (pas de CORS).
#                        /api/* -> Laravel (php-fpm) ; /* -> SPA (build Vite).
# Server 2 (port 8080) : SITE MARKETING (statique). Sur son propre port pour éviter
#                        les pièges de sous-chemin (base Vite / liens absolus).
#                        Penser à ouvrir le port : sudo ufw allow 8080
#
# Ce fichier reflète la config installée dans /etc/nginx/sites-available/prise-api.
# Adapter : server_name (si domaine), le socket php-fpm, les chemins.

server {
    listen 80;
    server_name 143.110.210.158;   # remplacer par ton domaine si tu en as un

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    charset utf-8;
    client_max_body_size 20M;

    # Racine = build de l'APP web (déployé par le workflow frontend-cd)
    root /var/www/prise-web;
    index index.html;

    # --- API Laravel : /api/* et le health /up passent par le front controller ---
    location /api {
        root /var/www/prise-api/prise-inventaire-api/public;
        try_files $uri /index.php?$query_string;
    }
    location = /up {
        root /var/www/prise-api/prise-inventaire-api/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/prise-api/prise-inventaire-api/public;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- SPA React : fichiers statiques + fallback routing client ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Site marketing (statique) sur le port 8080 ---
server {
    listen 8080;
    server_name 143.110.210.158;

    root /var/www/prise-marketing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
