# Nginx — Prise Inventaire (DigitalOcean)
#
# Server 1 (port 80)   : APP web (SPA React) + API Laravel, MÊME origine (pas de CORS).
#                        /api/* -> Laravel (php-fpm) ; /* -> SPA (build Vite).
# Server 2 (port 8080) : SITE MARKETING (statique). Sur son propre port pour éviter
#                        les pièges de sous-chemin (base Vite / liens absolus).
#                        Penser à ouvrir le port : sudo ufw allow 8080
#
# Installation :
#   sudo cp deploy/nginx-prise-inventaire.conf /etc/nginx/sites-available/prise-inventaire
#   sudo ln -sf /etc/nginx/sites-available/prise-inventaire /etc/nginx/sites-enabled/prise-inventaire
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adapter : server_name (si domaine), le socket php-fpm, les chemins.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # remplacer par ton domaine si tu en as un

    # Racine = build de l'APP web (déployé par le workflow frontend-cd)
    root /var/www/prise-web;
    index index.html;

    client_max_body_size 20M;

    # --- API Laravel : tout /api/* (et le health /up) passe par le front controller ---
    location /api {
        try_files $uri @laravel;
    }
    location = /up {
        try_files $uri @laravel;
    }

    location @laravel {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        # Le front controller Laravel reste public/index.php de l'API existante
        fastcgi_param SCRIPT_FILENAME /var/www/prise-api/prise-inventaire-api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # REQUEST_URI conserve /api/... pour que le routeur Laravel matche les routes
        fastcgi_param REQUEST_URI $request_uri;
    }

    # --- SPA React : fichiers statiques + fallback routing client ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets hashés du build Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# --- Site marketing (statique) sur le port 8080 ---
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/prise-marketing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
